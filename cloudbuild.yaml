
steps:
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        echo "Uploading DAG files to Cloud Composer..."
        gsutil -m cp DAG/*.py gs://us-central1-sureshdag-fe9389ec-bucket/dags/

        echo "Uploading SQL files to Cloud Composer..."
        gsutil -m rsync -r SQL gs://us-central1-sureshdag-fe9389ec-bucket/dags/SQL

        echo "Deployment completed."

options:
  logging: CLOUD_LOGGING_ONLY
